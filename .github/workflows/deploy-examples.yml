name: Deploy examples to GitHub Pages

# Builds all five examples as static exports and publishes them under one
# GitHub Pages site: a landing page at the root, each example at its own
# sub-path (e.g. /<repo>/basic-list-detail/).
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". No secrets or tokens are required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the OIDC-based Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Build examples
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          examples="basic-list-detail auth-gated permission-gated dynamic-routes search-with-suggest"
          rm -rf dist
          mkdir -p dist
          for ex in $examples; do
            echo "::group::build $ex"
            NEXT_BASE_PATH="/$REPO/$ex" pnpm --filter "./examples/$ex" build
            mkdir -p "dist/$ex"
            cp -R "examples/$ex/out/." "dist/$ex/"
            echo "::endgroup::"
          done
          # Landing page linking to every example.
          cp .github/pages/index.html dist/index.html
          # Serve `_next/` (underscore-prefixed) directories: disable Jekyll.
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
